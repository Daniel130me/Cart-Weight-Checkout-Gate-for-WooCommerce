name: Deploy to WordPress.org

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version to deploy
        required: true
        default: '1.3.3'

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Deploy plugin
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: danielkay
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: cartquota-minimum-weight-woocommerce
          VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}

      - name: Attach installable ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
          files: ${{ steps.deploy.outputs.zip-path }}
